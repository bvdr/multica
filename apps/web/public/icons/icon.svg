<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ContextPRO">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png). Full-bleed because both surfaces mask the artwork
    themselves: iOS rounds the corners, Android crops to the launcher shape.
    The ContextPRO mark (an open ring framing a dot: the thing in focus inside a
    context window) is held at ~52% of the canvas so it stays inside the
    maskable safe zone (the centre circle of 80% diameter). See app/manifest.ts.
  -->
  <rect width="512" height="512" fill="#111827"/>
  <g transform="translate(256 256) scale(2.6) translate(-50 -50)">
    <path d="M 75.5 75.5 A 36 36 0 1 1 75.5 24.5" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="60" cy="50" r="11" fill="#ffffff"/>
  </g>
</svg>
